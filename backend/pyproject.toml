[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "motionmind-backend"
version = "0.1.0"
description = "FastAPI backend for MotionMind movement intelligence platform"
authors = [{ name = "MotionMind Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28,<2.1.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q -v"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

